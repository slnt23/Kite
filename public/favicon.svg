<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .ring { fill: none; stroke: #171717; stroke-width: 2.5; }
      .inner { fill: #171717; }
      .needle { fill: #171717; }
      .accent { fill: #f5a623; }
    </style>
  </defs>
  <!-- 外圈 -->
  <circle class="ring" cx="16" cy="16" r="13"/>
  <!-- 内圈 -->
  <circle class="ring" cx="16" cy="16" r="8" stroke-width="1.5" opacity="0.35"/>
  <!-- 指南针指针 - 东北方向 -->
  <polygon class="needle" points="16,4 20,14 16,12 12,14"/>
  <polygon class="accent" points="16,28 12,18 16,20 20,18"/>
  <!-- 中心点 -->
  <circle class="inner" cx="16" cy="16" r="2.5"/>
</svg>
